<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu TikTok</title>
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu TikTok">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <div class="who">
      <img id="avatar" alt="" hidden>
      <div>
        <h1 id="name">Meu TikTok</h1>
        <p id="updated" class="muted">Carregando…</p>
      </div>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Atualizar">↻</button>
  </header>

  <section id="setup" class="card" hidden>
    <h2>Conectar sua conta</h2>
    <p class="muted">Siga o passo a passo do README para criar o app no TikTok e cadastrar os secrets no GitHub. Depois toque abaixo:</p>
    <button id="connect" class="primary">Conectar TikTok</button>
    <p id="setup-msg" class="muted small"></p>
  </section>

  <section id="dash" hidden>
    <div class="card hero">
      <p class="muted">Visualizações totais</p>
      <p id="total" class="big">0</p>
      <p id="delta" class="small"></p>
      <div class="progress"><span id="bar"></span></div>
      <p id="next" class="muted small"></p>
    </div>

    <div class="stats">
      <div class="card stat"><p class="muted">Seguidores</p><p id="followers">0</p></div>
      <div class="card stat"><p class="muted">Curtidas</p><p id="likes">0</p></div>
      <div class="card stat"><p class="muted">Comentários</p><p id="comments">0</p></div>
      <div class="card stat"><p class="muted">Vídeos</p><p id="count">0</p></div>
    </div>

    <div class="card">
      <div class="row">
        <h2>Visualizações ao longo do tempo</h2>
      </div>
      <svg id="chart" viewBox="0 0 320 120" preserveAspectRatio="none" role="img" aria-label="Gráfico de visualizações"></svg>
      <p id="chart-note" class="muted small"></p>
    </div>

    <div class="card">
      <div class="row">
        <h2>Seus vídeos</h2>
        <div class="tabs" role="tablist">
          <button data-sort="views" class="on">Mais vistos</button>
          <button data-sort="recent">Recentes</button>
        </div>
      </div>
      <ul id="videos"></ul>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
