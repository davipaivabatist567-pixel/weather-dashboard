name: App Android (APK)

on:
  push:
    paths: ['android/**', 'meu-tiktok.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Montar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk MeuTikTok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuTikTok-apk
          path: MeuTikTok.apk

      # Link fixo para baixar no celular:
      # https://github.com/<dono>/<repo>/releases/download/apk-latest/MeuTikTok.apk
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Meu TikTok (APK)
          body: |
            Baixe o **MeuTikTok.apk** abaixo no celular Android e abra para instalar
            (permita "instalar apps desconhecidos" se o Android pedir).
            Versão do commit ${{ github.sha }}.
          files: MeuTikTok.apk
          make_latest: true
